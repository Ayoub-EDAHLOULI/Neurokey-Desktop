# Builds, signs and uploads a NeuroKey release, including the latest.json
# file the in-app updater reads.
#
# Release a new version:
#   1. Bump "version" in src-tauri/tauri.conf.json (and package.json / Cargo.toml)
#   2. Commit, then: git tag v0.2.0 && git push origin v0.2.0
#   3. Review the draft release on GitHub and click "Publish release"
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (leave empty if none)

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: NeuroKey Desktop v__VERSION__
          releaseBody: See the README for what's new and what leaves your computer.
          # Draft first so you can review the notes and files before users get it
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Point the generic "windows-x86_64" fallback in latest.json at the
          # NSIS setup.exe (what most users install) instead of the MSI
          updaterJsonPreferNsis: true

  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Store build: updater compiled out, Store text in Settings
      - name: Build Store exe
        env:
          VITE_STORE_BUILD: "true"
        run: npx tauri build --features store --no-bundle

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory msix-staging | Out-Null
          Copy-Item src-tauri\target\release\neurokey-desktop.exe msix-staging\
          Copy-Item Assets msix-staging\Assets -Recurse

          # Take the version from tauri.conf.json so the manifest can never drift
          $v = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          (Get-Content Package.appxmanifest -Raw) `
            -replace '(<Identity[^>]*Version=")[^"]*"', "`${1}$v.0`"" |
            Set-Content msix-staging\AppxManifest.xml -Encoding utf8
          "MSIX_VERSION=$v.0" >> $env:GITHUB_ENV

      - name: Pack MSIX (Windows SDK)
        shell: pwsh
        run: |
          # Fail the step if makepri/makeappx exit with an error
          $PSNativeCommandUseErrorActionPreference = $true

          # Newest installed SDK that actually ships both tools. Sort the version
          # folders (10.0.x.y) as versions: old SDKs like 10.0.14393 lack makepri.
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" -Directory |
                 Where-Object { (Test-Path "$($_.FullName)\x64\makepri.exe") -and (Test-Path "$($_.FullName)\x64\makeappx.exe") } |
                 Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $sdk) { throw "No Windows SDK with makepri.exe and makeappx.exe found" }
          $bin = "$($sdk.FullName)\x64"
          Write-Host "Using Windows SDK $($sdk.Name)"

          & "$bin\makepri.exe" createconfig /cf priconfig.xml /dq en-US /pv 10.0.0 /o
          & "$bin\makepri.exe" new /pr msix-staging /cf priconfig.xml /mn msix-staging\AppxManifest.xml /of msix-staging\resources.pri /o
          & "$bin\makeappx.exe" pack /d msix-staging /p "NeuroKey_${env:MSIX_VERSION}_x64.msix" /o

      # Unsigned on purpose: Microsoft signs it after Store certification.
      # Kept as a workflow artifact only; NOT attached to the GitHub release,
      # because users couldn't install an unsigned MSIX anyway.
      - uses: actions/upload-artifact@v4
        with:
          name: neurokey-msix
          path: NeuroKey_*_x64.msix
